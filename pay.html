<!DOCTYPE html>
<html>
<head>
    <title>Secure Payment</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Razorpay Checkout Script -->
    <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
    <style>
        /* Invisible background, we only want the popup to show */
        body { 
            margin: 0; 
            padding: 0; 
            background-color: transparent; 
        }
    </style>
</head>
<body>
<script>
    // App se message receive karna
    window.addEventListener("message", function(event) {
        const data = event.data;
        
        if (data && data.action === 'PAY') {
            
            const options = {
                "key": data.razorpayKeyId,
                "amount": data.amount, // in paise
                "currency": "INR",
                "name": "Recharge Pe",
                "description": "Plan " + (data.amount / 100),
                "handler": function (response) {
                    // Payment successful hone par App ko wapas batao
                    window.parent.postMessage({
                        status: 'success',
                        razorpay_payment_id: response.razorpay_payment_id
                    }, "*");
                },
                "modal": {
                    "ondismiss": function() {
                        // User ne popup band kiya toh App ko batao
                        window.parent.postMessage({
                            status: 'cancelled'
                        }, "*");
                    }
                },
                "prefill": {
                    "contact": data.phone,
                    "email": "customer@rechargepe.com"
                },
                "theme": {
                    "color": "#7c3aed"
                }
            };
            
            const rzp = new Razorpay(options);
            
            rzp.on('payment.failed', function (response){
                // Payment fail hone par App ko batao
                window.parent.postMessage({
                    status: 'failed',
                    error: response.error
                }, "*");
            });
            
            // Popup open karo
            rzp.open();
        }
    });
</script>
</body>
</html>
