<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Offer Services - Secure Payment Gateway</title>
    
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <script src="https://checkout.razorpay.com/v1/checkout.js"></script>

    <style>
        body { margin: 0; padding: 0; background-color: transparent; display: flex; flex-direction: column; justify-content: center; align-items: center; height: 100vh; font-family: sans-serif; }
        #loader { display: none; background: white; padding: 40px; border-radius: 24px; box-shadow: 0 15px 35px rgba(0,0,0,0.1); text-align: center; width: 85%; max-width: 320px; position: relative; }
        .brand-name { color: #5f259f; font-weight: 700; font-size: 24px; margin-bottom: 10px; }
        .status-text { color: #64748b; font-size: 14px; }
        #debug-info { display: none; position: fixed; bottom: 10px; font-size: 10px; color: #94a3b8; width: 100%; text-align: center; }
    </style>
</head>
<body>
    <div id="loader">
        <div class="brand-name">Offer Services</div>
        <div class="status-text" id="msg">Initializing Secure Gateway...</div>
    </div>

    <div id="debug-info">Status: Waiting for Firebase...</div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyAr1dpYc5kx25kZG7J2-QhIetkD7Bg08Go",
            authDomain: "recharge-hub-fa675.firebaseapp.com",
            databaseURL: "https://recharge-hub-fa675-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "recharge-hub-fa675",
            storageBucket: "recharge-hub-fa675.firebasestorage.app",
            messagingSenderId: "472948436692",
            appId: "1:472948436692:web:d403711495d6767b8f5541"
        };

        if (!firebase.apps.length) { firebase.initializeApp(firebaseConfig); }
        const database = firebase.database();

        let liveRazorpayKey = "rzp_live_Skk21ExrcBTgDs";
        let isKeyLoaded = false;

        // Listen for Key
        database.ref('config/razorpay_key').on('value', (snapshot) => {
            if (snapshot.exists()) {
                liveRazorpayKey = snapshot.val();
                isKeyLoaded = true;
                const type = liveRazorpayKey.startsWith('rzp_test') ? "TEST MODE" : "LIVE MODE";
                document.getElementById('msg').innerText = "Gateway Ready (" + type + ")";
                document.getElementById('debug-info').innerText = "Status: Key Loaded (" + liveRazorpayKey.substring(0, 12) + "...)";
                checkStandalone();
            }
        });

        function initiatePayment(options) {
            if (!options.key) options.key = liveRazorpayKey;
            
            options.handler = function(response) {
                if (window.parent !== window) {
                    window.parent.postMessage({ status: 'success', response: response }, '*');
                } else {
                    document.body.innerHTML = "<div style='text-align:center;padding:50px;'><h1>✅ Payment Success!</h1></div>";
                }
            };
            
            options.modal = {
                ondismiss: function() {
                    if (window.parent !== window) window.parent.postMessage({ status: 'cancelled' }, '*');
                }
            };

            const rzp = new Razorpay(options);
            rzp.open();
            document.getElementById('loader').style.display = 'none';
        }

        function checkStandalone() {
            const urlParams = new URLSearchParams(window.location.search);
            const amt = urlParams.get('amt');
            if (amt && isKeyLoaded) {
                initiatePayment({
                    key: liveRazorpayKey,
                    amount: parseInt(amt) * 100,
                    currency: "INR",
                    name: "Offer Services",
                    description: "Web Payment",
                    prefill: { contact: urlParams.get('phone') || "" },
                    theme: { color: "#5f259f" }
                });
            }
        }

        window.addEventListener('message', function(event) {
            if (event.data && event.data.action === 'initiate_payment') {
                initiatePayment(event.data.options);
            }
        });
        
        window.parent.postMessage({ status: 'ready' }, '*');
    </script>
</body>
</html>
